<!doctype html>
<!-- YOUKAI 1.0 | 作者：二百七 | Copyright (c) 2026 二百七 | SPDX-License-Identifier: MIT -->
<html>
<head>
  <meta charset="utf-8">
  <title>YOUKAI</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="bootStatus" class="youkai-boot-status">正在启动 Youkai 系统环境...</div>
  <main class="shell">
    <header class="topbar">
      <div class="topbar-main">
        <div class="youkai-brand">
          <div id="youkaiLogoBtn" class="logo-wrap" style="cursor: pointer;" title="访问作者博客">
            <span class="logo-title">YOUKAI</span>
          </div>
          <button id="youkaiUpdateBadge" class="youkai-new-badge" hidden aria-label="发现新版本，查看更新">NEW</button>
        </div>
        <select id="categorySelect" class="cpp-mode-select" title="选择插件分类">
          <option value="all">全部分类</option>
        </select>
      </div>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="输入关键字搜索脚本" spellcheck="false" autocomplete="off">
        <button id="refreshBtn">刷新清单</button>
      </div>
      <div class="topbar-actions">
        <button id="toggleUnifiedSettingsBtn" class="quick-filter-btn">系统设置</button>
        <button id="openCurrentFolderBtn" class="quick-filter-btn" title="打开当前文件所在文件夹">打开目录</button>
      </div>
    </header>

    <section id="youkaiUpdateCard" class="youkai-update-card" hidden aria-label="软件更新">
      <div class="youkai-update-heading"><strong id="youkaiUpdateTitle">软件更新</strong><button id="youkaiCloseUpdateBtn" class="quick-filter-btn" aria-label="收起更新">×</button></div>
      <p id="youkaiUpdateStatus" role="status" aria-live="polite"></p>
      <div class="youkai-update-actions">
        <button id="youkaiApplyUpdateBtn" class="primary-create" hidden>立即更新</button>
        <button id="youkaiReleaseBtn" class="quick-filter-btn" hidden>更新说明</button>
        <button id="youkaiReloadUpdateBtn" class="primary-create" hidden>重新加载</button>
      </div>
    </section>
    <section id="contentPanel" class="content">
      <div id="scriptList" class="script-list"></div>
    </section>

    <footer class="footerbar">
      <div style="display: flex; gap: 4px; width: 100%;">
        <button id="batchZzzBtn" class="primary-create" style="flex: 1;">批处理选中脚本</button>
      </div>
      <span id="toast" class="toast">系统就绪</span>
    </footer>
  </main>

  <!-- 弹窗：统一设置中心 -->
  <section id="unifiedSettingsModal" class="modal-backdrop">
    <div class="unified-settings-container">
      <header class="modal-head doc-head">
        <div class="unified-tabs">
          <button class="unified-tab active" data-target="settingsForm">全局路径</button>
          <button class="unified-tab" data-target="sourceForm">源管理</button>
          <button class="unified-tab" data-target="shortcutForm">快捷键</button>
          <button class="unified-tab" data-target="classifyForm">导出与分类</button>
        </div>
        <button id="closeUnifiedSettingsBtn" class="zzz-close-btn">✕</button>
      </header>
      <div class="unified-body">
        
        <!-- Tab 1: 全局路径 -->
        <div id="settingsForm" class="unified-panel active">
          <div class="settings-form">
            <label for="settingOutputFolderInput">1. 默认打包/转大货路径</label>
            <div class="batch-folder-row">
              <input id="settingOutputFolderInput" type="text" placeholder="选择打包输出文件夹">
              <button id="browseOutputFolderBtn">选择</button>
            </div>

            <label for="settingExportFolderInput">2. 默认效果图导出路径 (JPG/PNG)</label>
            <div class="batch-folder-row">
              <input id="settingExportFolderInput" type="text" placeholder="选择图片导出文件夹">
              <button id="browseExportFolderBtn">选择</button>
            </div>

            <label for="settingCsvFolderInput">3. 变量表 (CSV) 配置文件路径</label>
            <div class="batch-folder-row">
              <input id="settingCsvFolderInput" type="text" placeholder="选择或粘贴 CSV 变量表目录">
              <button id="browseCsvFolderBtn">选择</button>
            </div>

            <div class="settings-actions">
              <button id="saveSettingsBtn" class="primary-create" style="margin-top:10px;">保存所有系统设置</button>
            </div>
            <div class="youkai-version-row">当前版本 <span id="youkaiCurrentVersion">—</span><button id="youkaiCheckUpdateBtn" class="quick-filter-btn">检查更新</button></div>
          </div>
        </div>

        <!-- Tab 2: 源管理 -->
        <div id="sourceForm" class="unified-panel">
          <div class="source-form">
            <input id="sourceNameInput" type="text" placeholder="别名">
            <input id="folderInput" type="text" placeholder="粘贴绝对路径">
            <button id="addSourceBtn">添加</button>
            <button id="saveSourceBtn">修改</button>
            <button id="removeSourceBtn">解绑</button>
          </div>
          <div id="sourceList" style="margin-top:8px; max-height:200px; overflow-y:auto;"></div>
        </div>

        <!-- Tab 3: 快捷键 -->
        <div id="shortcutForm" class="unified-panel">
          <div class="shortcut-tips">提示：点击输入框按下快捷键即可绑定。</div>
          <div id="shortcutList" class="shortcut-list" style="max-height: 250px; overflow-y: auto;"></div>
        </div>

        <!-- Tab 4: 导出与分类 -->
        <div id="classifyForm" class="unified-panel">
          <div class="settings-form" style="padding: 10px;">
            <label class="zzz-check-row" style="margin-bottom: 15px; display: flex; align-items: center; justify-content: flex-start; gap: 8px;">
              <input type="checkbox" id="settingAutoClassifyCheck" style="width: auto; margin: 0;"> 
              <span style="font-size: 13px;">开启：在“导出指定图层”完成后，自动进行文件分类</span>
            </label>
            
            <label for="settingClassifyDelimInput">分类标识符：</label>
            <div class="batch-folder-row">
              <input id="settingClassifyDelimInput" type="text" placeholder="例如 @,_" value="@,_">
            </div>
            <div style="color: #99a0a8; font-size: 11px; margin-top: 5px;">
              提示：脚本会自动抓取导出图片名称中，位于最后一个分隔符之后的内容作为分类文件夹名。
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- 弹窗：Markdown 说明文档 -->
  <section id="docModal" class="modal-backdrop">
    <div class="doc-modal">
      <header class="modal-head doc-head">
        <div style="display: flex; align-items: center; gap: 6px;">
          <div id="docTitle" class="doc-title">脚本说明</div>
          <button id="openCsvBtn" class="doc-csv-btn" style="display: none;">📂 变量</button>
        </div>
        <button id="closeDocBtn" class="doc-close-btn">✕</button>
      </header>
      <div id="docContent" class="doc-body"></div>
    </div>
  </section>

  <!-- 弹窗：YOUKAI批处理 -->
  <section id="batchModalZZZ" class="modal-backdrop zzz-backdrop">
    <div class="zzz-batch-container">
      <header class="zzz-batch-header">
        <div class="zzz-batch-title">指令添加辅助 (批处理工作流)</div>
        <button id="closeBatchZzzBtn" class="zzz-close-btn">✕</button>
      </header>
      
      <div class="zzz-batch-body">
        <!-- 左侧：功能库 -->
        <div class="zzz-batch-lib">
          <div class="zzz-panel-title">功能库</div>
          <div class="zzz-search-box">
            <input type="text" id="zzzBatchSearch" placeholder="输入关键词，搜索脚本...">
          </div>
          <div id="zzzBatchLibList" class="zzz-lib-list">
            <!-- Scripts injected here -->
          </div>
        </div>
        
        <!-- 右侧：任务列表 -->
        <div class="zzz-batch-tasks">
          <div class="zzz-panel-title">任务列表 (已选)</div>
          <div id="zzzBatchTaskList" class="zzz-tasks-list">
            <!-- Added tasks injected here -->
          </div>
          
          <div class="zzz-batch-settings">
            <div class="zzz-settings-title">全局参数</div>
            <div class="zzz-folder-row">
              <input type="text" id="zzzBatchFolderInput" placeholder="选择或粘贴待处理的 AI 根目录">
              <button id="zzzBrowseBatchFolderBtn" class="zzz-btn-sub">选择</button>
            </div>
            <label class="zzz-check-row">
              <input type="checkbox" id="zzzBatchSaveSource"> 保存修改后的源 AI 文件
            </label>
            <div id="zzzBatchSaveOptions" style="display:none; padding-left:20px; font-size:11px; color:#99a0a8; flex-direction:column; gap:4px; margin-bottom: 8px;">
              <label class="zzz-check-row">
                <input type="checkbox" id="zzzBatchPdfCompat"> 创建 PDF 兼容文件 (大体积)
              </label>
              <label class="zzz-check-row">
                <input type="checkbox" id="zzzBatchUseCompression" checked> 使用压缩
              </label>
              <label class="zzz-check-row">
                <input type="checkbox" id="zzzBatchEmbedIcc" checked> 嵌入 ICC 配置文件
              </label>
            </div>
            <div id="zzzBatchStatus" class="zzz-batch-status">
              <div class="zzz-status-label">当前状态:</div>
              <div class="zzz-status-text">等待执行...</div>
            </div>
          </div>
        </div>
      </div>
      
      <footer class="zzz-batch-footer">
        <button id="zzzStartBatchBtn" class="zzz-btn-primary">生成指令单并执行</button>
        <button id="zzzStopBatchBtn" class="zzz-btn-danger" style="display:none;">停止批处理</button>
      </footer>
    </div>
  </section>

  <script src="assets/js/CSInterface.js"></script>
  <script src="assets/js/update-ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
